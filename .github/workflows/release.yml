name: Build and Release PQC Signed APK

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0

jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for GitHub Actions to create a Release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android Build Tools
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;37.0.0"

      - name: Build Unsigned Release APK
        run: ./gradlew assembleRelease

      - name: Sign APK with PQC Hybrid Scheme
        env:
          PQC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: signing/sign.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
          generate_release_notes: true

