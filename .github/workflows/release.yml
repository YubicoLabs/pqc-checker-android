name: Build and Release PQC Signed APK

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0

jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for GitHub Actions to create a Release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24' # Required for ML-DSA-65 support
          distribution: 'temurin'
          cache: gradle

      - name: Install Android Build Tools 36.0.0
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-keystore.jks

      - name: Build Unsigned Release APK
        run: ./gradlew assembleRelease

      - name: Sign APK with PQC Hybrid Scheme
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CLASSICAL_ALIAS: ${{ secrets.CLASSICAL_KEY_ALIAS }}
          PQC_ALIAS: ${{ secrets.PQC_KEY_ALIAS }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="app-release-signed.apk"
          
          $APKSIGNER sign \
            --out $SIGNED_APK \
            --ks my-keystore.jks --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias $CLASSICAL_ALIAS \
            --hybrid-signer-role classical \
            --next-signer \
            --ks my-keystore.jks --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias $PQC_ALIAS \
            --hybrid-signer-role pqc \
            $UNSIGNED_APK

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-release-signed.apk
          generate_release_notes: true

